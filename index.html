<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>전기의 이용 가상 실험실 | 6학년 2학기 과학</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#dfe9e4; --surface:#ffffff; --ink:#1d2b33; --muted:#5f6f76; --line:#c9d8d1;
  --chalk:#1f4a3d; --chalk-ink:#f3f7f2; --volt:#ffcf33; --sky:#2f7de1; --ok:#1f9d55; --warn:#e5484d;
  --board:#eef6f0; --grid:#d6e7dc; --chip:#f6faf8;
  --wall:#e9f1f6; --table:#d8b98d; --tableEdge:#b38a59;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121a17; --surface:#1b2420; --ink:#e8efe9; --muted:#9fb0a8; --line:#2c3a34;
    --chalk:#16352c; --chalk-ink:#eaf3ec; --board:#18231e; --grid:#22312a; --chip:#212c27;
    --wall:#18212a; --table:#5b4632; --tableEdge:#46351f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121a17; --surface:#1b2420; --ink:#e8efe9; --muted:#9fb0a8; --line:#2c3a34;
  --chalk:#16352c; --chalk-ink:#eaf3ec; --board:#18231e; --grid:#22312a; --chip:#212c27;
  --wall:#18212a; --table:#5b4632; --tableEdge:#46351f;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overflow:hidden}
button{touch-action:manipulation}
.app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:18px;padding:10px 18px;background:var(--chalk);color:var(--chalk-ink);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.bolt{width:38px;height:38px;border-radius:12px;background:var(--volt);display:grid;place-items:center;font-size:22px;box-shadow:0 0 0 3px rgba(255,207,51,.25)}
.brand h1{font-family:"Jua",sans-serif;font-weight:400;font-size:24px;margin:0;letter-spacing:.5px}
.brand p{margin:0;font-size:13px;opacity:.8}
.tabs{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.tab{font-family:"Jua",sans-serif;font-size:17px;padding:9px 18px;border-radius:14px;border:2px solid rgba(255,255,255,.25);background:transparent;color:var(--chalk-ink);cursor:pointer}
.tab:hover{border-color:rgba(255,255,255,.6)}
.tab.on{background:var(--volt);border-color:var(--volt);color:#2a2100}
.tab:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
main{flex:1;min-height:0;display:grid;grid-template-columns:128px minmax(0,1fr) 300px;gap:10px;padding:10px}
main.em{grid-template-columns:minmax(0,1fr) 300px}
main.em .palette{display:none}
.palette{-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;position:relative;z-index:1}
.palette .ph{font-family:"Jua",sans-serif;font-size:15px;text-align:center;color:var(--muted);padding:2px 0}
.palette.del{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 9%,var(--surface));box-shadow:inset 0 0 0 2px var(--warn)}
.palette.del .ph{color:var(--warn)}
.pitem{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 6px;border-radius:14px;background:var(--chip);border:2px solid var(--line);cursor:grab;touch-action:pan-y}
.pitem:hover{border-color:var(--volt)}
.pitem:active{cursor:grabbing}
.pitem svg{width:100%;height:50px;pointer-events:none}
.pitem span{font-size:13px;font-weight:700;text-align:center;line-height:1.2;pointer-events:none}
.stage{position:relative;min-width:0;min-height:0;z-index:2}
.stage svg{width:100%;height:100%;display:block;touch-action:none;overflow:visible}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;overflow-y:auto;font-size:15px}
.status{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--chip);border:2px solid var(--line);line-height:1.45;min-height:64px}
.status .si{font-size:24px;line-height:1}
.status.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--surface))}
.status.warn{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--surface))}
.status.lit{border-color:#e0a800;background:color-mix(in srgb,var(--volt) 22%,var(--surface))}
.sec{margin-top:16px}
.sec h3{font-family:"Jua",sans-serif;font-weight:400;font-size:17px;margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
button{font-family:inherit;font-size:14px;font-weight:700;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--sky)}
button.wide{width:100%;margin-top:16px}
button.big{width:100%;font-size:17px;padding:12px;font-family:"Jua",sans-serif;font-weight:400}
button.big.on{background:var(--volt);border-color:#e0a800;color:#2a2100}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.seg button.on{background:var(--sky);border-color:var(--sky);color:#fff}
.tg{display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer}
.tg input{width:20px;height:20px;accent-color:var(--sky)}
.devices{display:flex;flex-direction:column;gap:8px}
.dev{display:flex;gap:10px;align-items:center}
.dev .di{font-size:22px;width:28px;text-align:center}
.dev .dm{flex:1}
.dev .dn{display:flex;justify-content:space-between;font-size:14px}
.dev .dn b{font-weight:700}
.bar{height:9px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd75a,#ff9f1a);border-radius:9px;transition:width .3s}
.dnum{font-size:12px;color:var(--muted);margin-top:2px}
.empty{color:var(--muted);font-size:14px}
.how{color:var(--ink);font-size:14px;line-height:1.55}
.how summary{font-family:"Jua",sans-serif;font-size:17px;cursor:pointer}
.how ul,.how ol{padding-left:20px;margin:8px 0}
table.res{width:100%;border-collapse:collapse;font-size:15px}
table.res td{padding:7px 4px;border-bottom:1px solid var(--line)}
table.res td:last-child{text-align:right}
.rc{display:inline-block;padding:3px 10px;border-radius:10px;font-size:13px;font-weight:700}
.rc.y{background:#fff1b8;color:#6b4e00}
.rc.n{background:#e4e8ec;color:#45525a}
.rc.q{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.summary{margin-top:10px;padding:10px;border-radius:12px;background:color-mix(in srgb,var(--ok) 12%,var(--surface));font-size:14px;line-height:1.5}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.kv b.N{color:#e5484d} .kv b.S{color:#2f7de1}
.note{font-size:14px;color:var(--muted);line-height:1.5;margin:10px 0 0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--chalk);color:var(--chalk-ink);padding:12px 20px;border-radius:14px;font-size:16px;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* SVG classes */
svg text{font-family:inherit}
.boardbg{fill:var(--board)}
.gridline{stroke:var(--grid)}
.lbl{fill:var(--muted);font-size:14px;text-anchor:middle;font-weight:700;pointer-events:none}
.ghost{fill:#9aa3ab;font-size:12px;text-anchor:middle;pointer-events:none}
.bt{fill:#fff;font-size:12px;font-weight:700;text-anchor:middle;pointer-events:none}
.bp{fill:#5a3b00;font-size:17px;font-weight:900;text-anchor:middle;pointer-events:none}
.bm{fill:#cfd6e4;font-size:17px;font-weight:900;text-anchor:middle;pointer-events:none}
.swl{fill:#5a3714;font-size:12px;text-anchor:middle;font-weight:700;pointer-events:none}
.bz{fill:#8e959d;font-size:8px;text-anchor:middle;letter-spacing:1px;pointer-events:none}
.tm{fill:url(#gMetal);stroke:#6b7480;stroke-width:1.5}
.tm.mt{fill:rgba(255,255,255,.6);stroke:#7d848b;stroke-dasharray:3 2}
.tm.hot{stroke:#ff9f1a;stroke-width:4}
.droptgt{fill:none;stroke:#ff9f1a;stroke-width:3;stroke-dasharray:8 6;pointer-events:none}
.trash circle{fill:var(--surface);stroke:var(--line);stroke-width:2}
.trash.hot circle{fill:#ffe1e1;stroke:var(--warn);stroke-width:3}
.emptyhint{fill:var(--muted);font-size:22px;text-anchor:middle;pointer-events:none}
.emptyhint2{fill:var(--muted);font-size:16px;text-anchor:middle;pointer-events:none}
.tools{position:absolute;top:10px;right:12px;display:flex;gap:6px;z-index:3}
.tools button{background:var(--surface);box-shadow:0 2px 8px rgba(0,0,0,.12);padding:7px 12px;font-size:14px}
.tools button:disabled{opacity:.4;cursor:default}
.whit{fill:none;stroke:transparent;stroke-width:26;pointer-events:stroke;cursor:pointer}
.zone{fill:rgba(255,207,51,.10);stroke:#e0a800;stroke-width:2.5;stroke-dasharray:10 8}
.zonet{fill:#b78700;font-size:16px;text-anchor:middle;font-weight:700}
.flow{fill:none;stroke:#ffe14d;stroke-width:3.6;stroke-linecap:round;stroke-dasharray:1 16;pointer-events:none}
.wall{fill:var(--wall)} .table{fill:var(--table)} .tableEdge{fill:var(--tableEdge)}
.pole{fill:#fff;font-size:20px;text-anchor:middle;font-family:"Jua",sans-serif}
.cmpd{font-size:10px;text-anchor:middle;fill:#555;font-weight:700;pointer-events:none}
.emhint{fill:var(--muted);font-size:18px;pointer-events:none}
.grab{cursor:grab} .tap{cursor:pointer}
@media (max-height:820px) and (min-width:901px){
  .pitem{padding:5px 4px 4px}
  .pitem svg{height:38px}
  .pitem span{font-size:12px}
}
@media (max-width:900px){
  body{overflow:auto}
  .app{height:auto;min-height:100%}
  main,main.em{grid-template-columns:1fr}
  .palette{flex-direction:row;overflow-x:auto;padding:6px}
  .palette .ph{display:none}
  .pitem{min-width:94px;touch-action:pan-x}
  .stage{height:62vh}
}
@media (prefers-reduced-motion:reduce){ #toast{transition:none} .bar i{transition:none} }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gMetal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f6f8"/><stop offset=".5" stop-color="#c3cad2"/><stop offset="1" stop-color="#8d96a0"/></linearGradient>
    <linearGradient id="gIron" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfc5cc"/><stop offset=".5" stop-color="#858d96"/><stop offset="1" stop-color="#5b6169"/></linearGradient>
    <linearGradient id="gBatBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d5585"/><stop offset=".45" stop-color="#1f2b4a"/><stop offset="1" stop-color="#0e1424"/></linearGradient>
    <linearGradient id="gBatGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset=".5" stop-color="#e0a82e"/><stop offset="1" stop-color="#a97a12"/></linearGradient>
    <linearGradient id="gWood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ecbd84"/><stop offset=".5" stop-color="#cb8f51"/><stop offset="1" stop-color="#a8703a"/></linearGradient>
    <linearGradient id="gFoil" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9fb"/><stop offset=".35" stop-color="#c3ccd5"/><stop offset=".6" stop-color="#eef2f5"/><stop offset="1" stop-color="#a7b1bb"/></linearGradient>
    <radialGradient id="gGlow"><stop offset="0" stop-color="#fffbe0" stop-opacity="1"/><stop offset=".3" stop-color="#ffe066" stop-opacity=".85"/><stop offset=".65" stop-color="#ffc43d" stop-opacity=".28"/><stop offset="1" stop-color="#ffb000" stop-opacity="0"/></radialGradient>
    <radialGradient id="gRed"><stop offset="0" stop-color="#ff5a5a" stop-opacity=".6"/><stop offset="1" stop-color="#ff5a5a" stop-opacity="0"/></radialGradient>
    <radialGradient id="gBlue"><stop offset="0" stop-color="#4c8dff" stop-opacity=".6"/><stop offset="1" stop-color="#4c8dff" stop-opacity="0"/></radialGradient>
    <pattern id="pStraw" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><rect width="14" height="14" fill="#ffffff"/><rect width="6" height="14" fill="#3b82f6"/></pattern>
    <pattern id="pGrid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" class="gridline" stroke-width="1"/></pattern>
  </defs>
</svg>

<div class="app">
  <header>
    <div class="brand">
      <div class="bolt" aria-hidden="true">⚡</div>
      <div><h1>전기의 이용 가상 실험실</h1><p>6학년 2학기 과학 3단원</p></div>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" data-tab="circuit" role="tab">💡 전기 회로 만들기</button>
      <button class="tab" data-tab="conductor" role="tab">🔍 도체와 부도체</button>
      <button class="tab" data-tab="em" role="tab">🧲 전자석</button>
    </nav>
  </header>
  <main id="main">
    <div class="palette" id="palette"></div>
    <div class="stage">
      <div class="tools"><button id="undoBtn" title="되돌리기 (Ctrl+Z)">↶ 되돌리기</button><button id="fsBtn" title="전체 화면">⛶ 전체 화면</button></div>
      <svg id="board" viewBox="0 0 1200 760" preserveAspectRatio="xMidYMid meet" aria-label="전기 회로 실험대"></svg>
      <svg id="emsvg" viewBox="0 0 1200 760" preserveAspectRatio="xMidYMid meet" aria-label="전자석 실험대" style="display:none"></svg>
    </div>
    <aside class="panel" id="panel"></aside>
  </main>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ================= 기본 도구 ================= */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const boardSvg=$('#board'), emSvg=$('#emsvg');
function svgPt(svgEl,e){const p=svgEl.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svgEl.getScreenCTM().inverse());}
let toastT=null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2800);}

/* ================= 물리 상수 ================= */
const V_BAT=1.5, R_INT=0.3, R_LAMP=5, R_MOTOR=4, R_BUZZ=40;
const P0=R_LAMP*Math.pow(V_BAT/(R_LAMP+R_INT),2);   // 전지 1개+전구 1개 밝기 기준
const IM=V_BAT/(R_MOTOR+R_INT);                    // 전동기 기준 전류
const WIRE_COLORS=['#e5484d','#2b2d31','#2f7de1','#1f9d55','#f0a020'];
const TRASH={x:1138,y:700};
const ZONE={x:720,y:455,w:300,h:190,cx:870,cy:560};
const opt={flow:false,sound:true,num:false};

const MAT={
  wood:   {name:'나무 막대',     cond:false,t:62,ty:0, ly:30,vb:'-68 -18 136 36'},
  ironclip:{name:'철 집게',      cond:true, t:44,ty:2, ly:34,vb:'-50 -46 100 66'},
  paper:  {name:'색종이',        cond:false,t:50,ty:0, ly:56,vb:'-56 -42 112 84'},
  balloon:{name:'고무풍선',      cond:false,t:38,ty:-6,ly:78,vb:'-46 -52 92 122'},
  straw:  {name:'빨대',          cond:false,t:68,ty:0, ly:28,vb:'-72 -14 144 28'},
  nail:   {name:'철 못',         cond:true, t:62,ty:0, ly:30,vb:'-66 -16 132 32'},
  foil:   {name:'알루미늄 포일', cond:true, t:52,ty:0, ly:44,vb:'-58 -32 116 64'},
};
const NAMES={holder:'전지 끼우개',battery:'전지',bulbholder:'전구 끼우개',bulb:'전구',switch:'스위치',motor:'날개 달린 전동기',buzzer:'버저'};
const LBLY={holder:44,battery:36,bulbholder:48,bulb:56,switch:50,motor:78,buzzer:48};

/* ================= 그림(SVG) ================= */
function svgBattery(flip){
  const s=flip?-1:1;
  return `<g transform="scale(${s},1)">
    <rect x="-52" y="-12" width="5" height="24" rx="1.5" fill="url(#gMetal)"/>
    <rect x="-48" y="-16" width="76" height="32" rx="5" fill="url(#gBatBody)"/>
    <rect x="26" y="-16" width="18" height="32" rx="3" fill="url(#gBatGold)"/>
    <rect x="43" y="-7" width="7" height="14" rx="2" fill="url(#gMetal)" stroke="#8d96a0" stroke-width=".6"/>
    <rect x="-42" y="-12" width="64" height="5" rx="2.5" fill="#fff" opacity=".18"/>
  </g>
  <text x="${-8*s}" y="5" class="bt">1.5V</text>
  <text x="${35*s}" y="6" class="bp">+</text>
  <text x="${-38*s}" y="6" class="bm">−</text>`;
}
function svgHolder(c){
  return `<rect id="heat-${c.id}" x="-76" y="-30" width="152" height="60" rx="12" fill="#ff3b30" opacity="0" pointer-events="none"/>
  <rect x="-78" y="-4" width="18" height="8" rx="2" fill="url(#gMetal)" stroke="#7d868f" stroke-width=".8"/>
  <rect x="60" y="-4" width="18" height="8" rx="2" fill="url(#gMetal)" stroke="#7d868f" stroke-width=".8"/>
  <rect x="-66" y="-24" width="132" height="48" rx="9" fill="#2c2f35"/>
  <rect x="-60" y="-18" width="120" height="36" rx="6" fill="#43474f"/>
  <path d="M-59 -11 l7 3.7 -7 3.7 7 3.7 -7 3.7 7 3.7 -7 3.7" fill="none" stroke="#c9d0d7" stroke-width="2.4" stroke-linejoin="round"/>
  <rect x="55" y="-12" width="4" height="24" rx="1" fill="#c9d0d7"/>
  ${c.bat?`<g transform="translate(1 0)">${svgBattery(c.bat.flip)}</g>`:`<text y="5" class="ghost">전지를 끼워요</text>`}`;
}
function svgBulb(id,oy){
  const gy=oy-58;
  return `<circle id="glow-${id}" cx="0" cy="${gy}" r="60" fill="url(#gGlow)" opacity="0" pointer-events="none"/>
  <g transform="translate(0 ${oy})">
    <path d="M-12 -26 h24 v20 a12 6 0 0 1 -24 0z" fill="url(#gMetal)" stroke="#7d868f"/>
    <path d="M-12 -21 l24 3 M-12 -15 l24 3 M-12 -9 l24 3" stroke="#8d96a0" stroke-width="1.6"/>
    <circle cy="0" r="4" fill="#3d3d3d"/>
    <path id="glass-${id}" d="M-12 -26 C-12 -36 -28 -42 -28 -58 A28 28 0 1 1 28 -58 C28 -42 12 -36 12 -26Z" fill="#eaf4fb" fill-opacity=".72" stroke="#a9bccb" stroke-width="2"/>
    <path d="M-5 -27 L-7 -56 M5 -27 L7 -56" stroke="#7a7a7a" stroke-width="1.4" fill="none"/>
    <path id="fil-${id}" d="M-7 -56 q1.75 -6 3.5 0 t3.5 0 t3.5 0 t3.5 0" stroke="#6b6b6b" stroke-width="2" fill="none"/>
    <ellipse cx="-12" cy="-68" rx="5" ry="9" fill="#fff" opacity=".55"/>
  </g>`;
}
function svgBulbHolder(c){
  return `<rect x="-62" y="10" width="16" height="8" rx="2" fill="url(#gMetal)" stroke="#7d868f" stroke-width=".8"/>
  <rect x="46" y="10" width="16" height="8" rx="2" fill="url(#gMetal)" stroke="#7d868f" stroke-width=".8"/>
  <rect x="-52" y="0" width="104" height="28" rx="10" fill="#efe9dc" stroke="#cbbfa6" stroke-width="1.5"/>
  <circle cx="-38" cy="14" r="5.5" fill="url(#gMetal)" stroke="#7d868f"/><path d="M-41 14h6" stroke="#6b7480" stroke-width="1.4"/>

/* ================= 회로 실험대 상태 ================= */
let tab='circuit', uid=1;
const nid=p=>p+(uid++);
function newState(){return {comps:[],wires:[],sim:null,results:{},hover:null,drop:null,trashHot:false,flowOff:{},motorAng:{},_stack:new Map()};}

function addComp(S,type,x,y,extra={}){const c={id:nid('c'),type,x,y,...extra};S.comps.push(c);return c;}
function addWire(S,a,b,color){const w={id:nid('w'),a,b,color:color||WIRE_COLORS[S.wires.length%WIRE_COLORS.length]};S.wires.push(w);return w;}
const T=(c,i)=>({t:c.id+':'+i});

function termOffsets(c){
  switch(c.type){
    case 'holder':return [[-76,0],[76,0]];
    case 'bulbholder':return [[-58,14],[58,14]];
    case 'switch':return [[-66,12],[66,12]];
    case 'motor':return [[-52,52],[52,52]];
    case 'buzzer':return [[-52,24],[52,24]];
    case 'material':{const m=MAT[c.mat];return [[-m.t,m.ty],[m.t,m.ty]];}
  }
  return [];
}
function termsOf(c){return termOffsets(c).map((o,i)=>({id:c.id+':'+i,x:c.x+o[0],y:c.y+o[1]}));}
function termPos(S,id){const [cid,i]=id.split(':');const c=S.comps.find(c=>c.id===cid);if(!c)return null;const o=termOffsets(c)[+i];return o?{x:c.x+o[0],y:c.y+o[1]}:null;}
function computeStack(S){const m=new Map();for(const w of S.wires)for(const k of ['a','b'])if(w[k].t){if(!m.has(w[k].t))m.set(w[k].t,[]);m.get(w[k].t).push(w.id+k);}S._stack=m;}
const STACK_OFF=[0,11,-11,22,-22,33,-33];
function endPos(S,w,k){
  const e=w[k];
  if(e.t){const p=termPos(S,e.t);if(p){const list=S._stack.get(e.t)||[];const n=list.indexOf(w.id+k);return {x:p.x+(STACK_OFF[n]||0),y:p.y};}e.t=null;}
  return {x:e.x,y:e.y};
}
function nearestTerm(S,pt,exclude){let best=null,bd=34;for(const c of S.comps)for(const t of termsOf(c)){if(t.id===exclude)continue;const d=Math.hypot(t.x-pt.x,t.y-pt.y);if(d<bd){bd=d;best=t.id;}}return best;}
function removeWire(S,w){S.wires=S.wires.filter(x=>x!==w);}
function removeComp(S,c){
  for(const w of S.wires)for(const k of ['a','b']){const e=w[k];if(e.t&&e.t.split(':')[0]===c.id){const p=termPos(S,e.t);e.x=p.x;e.y=p.y+10;e.t=null;}}
  S.comps=S.comps.filter(x=>x!==c);
}

/* ================= 끼우개 극끼리 바로 붙이기 ================= */
const SNAP_TYPES=new Set(['holder','bulbholder','switch']);
const snapTerms=S=>{const out=[];for(const c of S.comps)if(SNAP_TYPES.has(c.type))termOffsets(c).forEach((o,i)=>out.push({id:c.id+':'+i,c,side:Math.sign(o[0]),x:c.x+o[0],y:c.y+o[1]}));return out;};
function links(S){
  const T=snapTerms(S),L=[];
  for(let i=0;i<T.length;i++)for(let j=i+1;j<T.length;j++){const a=T[i],b=T[j];if(a.c!==b.c&&a.side!==b.side&&Math.hypot(a.x-b.x,a.y-b.y)<3)L.push([a,b]);}
  return L;
}
function findSnap(S,c){
  if(!SNAP_TYPES.has(c.type))return null;
  const all=snapTerms(S),linked=new Set();links(S).forEach(([a,b])=>{if(a.c!==c&&b.c!==c){linked.add(a.id);linked.add(b.id);}});
  const mine=all.filter(t=>t.c===c),others=all.filter(t=>t.c!==c&&!linked.has(t.id));
  let best=null,bd=40;
  for(const t of mine)for(const u of others){if(t.side===u.side)continue;const d=Math.hypot(t.x-u.x,t.y-u.y);if(d<bd){bd=d;best={t:t.id,u:u.id,dx:u.x-t.x,dy:u.y-t.y};}}
  return best;
}

/* ================= 회로 계산 (마디 해석) ================= */
function gauss(A,b,n){
  const M=A.map((r,i)=>{const x=new Float64Array(n+1);x.set(r);x[n]=b[i];return x;});
  for(let c=0;c<n;c++){
    let p=c;for(let r=c+1;r<n;r++)if(Math.abs(M[r][c])>Math.abs(M[p][c]))p=r;
    if(Math.abs(M[p][c])<1e-15)continue;
    if(p!==c){const t=M[p];M[p]=M[c];M[c]=t;}
    for(let r=c+1;r<n;r++){const f=M[r][c]/M[c][c];if(f===0)continue;for(let k=c;k<=n;k++)M[r][k]-=f*M[c][k];}
  }
  const x=new Float64Array(n);
  for(let r=n-1;r>=0;r--){let s=M[r][n];for(let k=r+1;k<n;k++)s-=M[r][k]*x[k];x[r]=Math.abs(M[r][r])<1e-15?0:s/M[r][r];}
  return x;
}
function solve(S,overrideId){
  const idx=new Map();let n=0;
  for(const c of S.comps)for(const t of termsOf(c))idx.set(t.id,n++);
  const el=[];
  for(const w of S.wires){if(w.a.t&&w.b.t&&w.a.t!==w.b.t&&idx.has(w.a.t)&&idx.has(w.b.t))el.push({k:'wire',id:w.id,a:idx.get(w.a.t),b:idx.get(w.b.t),g:50});}
  for(const [a,b] of links(S))el.push({k:'link',id:a.id+'~'+b.id,a:idx.get(a.id),b:idx.get(b.id),g:50});
  for(const c of S.comps){
    const Tn=termsOf(c).map(t=>idx.get(t.id));
    if(c.type==='holder'&&c.bat){const p=c.bat.flip?Tn[0]:Tn[1],q=c.bat.flip?Tn[1]:Tn[0];el.push({k:'bat',id:c.id,a:p,b:q,g:1/R_INT,E:V_BAT});}
    else if(c.type==='bulbholder'&&c.bulb)el.push({k:'lamp',id:c.id,a:Tn[0],b:Tn[1],g:1/R_LAMP});
    else if(c.type==='switch'&&c.on)el.push({k:'sw',id:c.id,a:Tn[0],b:Tn[1],g:50});
    else if(c.type==='motor')el.push({k:'motor',id:c.id,a:Tn[0],b:Tn[1],g:1/R_MOTOR});
    else if(c.type==='buzzer')el.push({k:'buzz',id:c.id,a:Tn[0],b:Tn[1],g:1/R_BUZZ});
    else if(c.type==='material'&&(MAT[c.mat].cond||c.id===overrideId))el.push({k:'mat',id:c.id,a:Tn[0],b:Tn[1],g:20});
  }
  const r={cur:{},vol:{}};
  if(!n)return r;
  const G=Array.from({length:n},()=>new Float64Array(n)),I=new Float64Array(n);
  for(const e of el){G[e.a][e.a]+=e.g;G[e.b][e.b]+=e.g;G[e.a][e.b]-=e.g;G[e.b][e.a]-=e.g;if(e.k==='bat'){I[e.a]+=e.E*e.g;I[e.b]-=e.E*e.g;}}
  for(let i=0;i<n;i++)G[i][i]+=1e-9;
  const v=gauss(G,I,n);
  for(const e of el){const dv=v[e.a]-v[e.b];r.vol[e.id]=dv;r.cur[e.id]=e.k==='bat'?(e.E-dv)*e.g:dv*e.g;}
  return r;
}

  if(!S.comps.length&&!S.wires.length)h+=`<text x="600" y="360" class="emptyhint">왼쪽에서 부품을 끌어와 전기 회로를 만들어 보세요</text><text x="600" y="396" class="emptyhint2">오른쪽 ‘예시 회로’ 버튼을 누르면 바로 시작할 수도 있어요</text>`;
  const paths={};
  for(const w of S.wires){const A=endPos(S,w,'a'),B=endPos(S,w,'b');paths[w.id]={A,B,d:wirePath(A.x,A.y+28,B.x,B.y+28)};h+=`<path class="whit" d="${paths[w.id].d}" data-kind="wire" data-w="${w.id}"/>`;}
  const snapIds=S.snap?[S.snap.t,S.snap.u]:[];
  for(const c of S.comps){
    const offs=termOffsets(c);
    const terms=offs.map((o,i)=>{const id=c.id+':'+i,hot=S.hover===id||snapIds.includes(id);return `<g data-kind="term" data-term="${id}" class="tap"><circle cx="${o[0]}" cy="${o[1]}" r="20" fill="transparent"/><circle cx="${o[0]}" cy="${o[1]}" r="${hot?10:(c.type==='material'?6:7)}" class="tm${c.type==='material'?' mt':''}${hot?' hot':''}"/></g>`;}).join('');
    let drop='';
    if(S.drop===c.id)drop=c.type==='holder'?`<rect class="droptgt" x="-84" y="-34" width="168" height="68" rx="14"/>`:`<rect class="droptgt" x="-64" y="-110" width="128" height="146" rx="14"/>`;
    h+=`<g transform="translate(${c.x.toFixed(1)} ${c.y.toFixed(1)})" data-kind="comp" data-id="${c.id}" class="grab">${drawComp(c,S)}${drop}<text class="lbl" y="${lblY(c)}">${compName(c)}</text>${terms}</g>`;
  }
  for(const [a] of links(S))h+=`<g transform="translate(${a.x.toFixed(1)} ${a.y.toFixed(1)})" pointer-events="none"><rect x="-13" y="-6" width="26" height="12" rx="4" fill="url(#gMetal)" stroke="#6b7480" stroke-width="1.2"/><circle r="2.6" fill="#6b7480"/></g>`;
  let wires='',clips='';
  for(const w of S.wires){
    const {A,B,d}=paths[w.id];
    wires+=wireSvg(d,w.color,w.id);
    clips+=clipSvg(A.x,A.y,w.color,`data-kind="clip" data-w="${w.id}" data-end="a" class="grab"`)+clipSvg(B.x,B.y,w.color,`data-kind="clip" data-w="${w.id}" data-end="b" class="grab"`);
  }
  h+=`<g pointer-events="none">${wires}</g>${clips}`;
  h+=`<g class="trash${S.trashHot?' hot':''}" transform="translate(${TRASH.x} ${TRASH.y})" pointer-events="none"><circle r="34"/><text y="11" text-anchor="middle" font-size="30">🗑️</text></g>`;
  boardSvg.innerHTML=h;
}

/* ================= 회로 실험대 조작 ================= */
let drag=null;
function insideBoard(e){const r=boardSvg.getBoundingClientRect();return e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;}
const nearTrash=p=>Math.hypot(p.x-TRASH.x,p.y-TRASH.y)<55;
function overPalette(e){if(tab==='em')return false;const r=$('#palette').getBoundingClientRect();return e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;}
function setPalDel(on){const P=$('#palette');if(P.classList.contains('del')===on)return;P.classList.toggle('del',on);const ph=P.querySelector('.ph');if(ph){if(on){ph.dataset.t=ph.textContent;ph.textContent='여기에 놓으면 치워요';}else if(ph.dataset.t)ph.textContent=ph.dataset.t;}}
const freeSpot=()=>({x:560+Math.random()*240,y:300+Math.random()*200});
const otherTerm=d=>d.w[d.k==='a'?'b':'a'].t;
function findHolder(S,b){return S.comps.find(h=>h.type==='holder'&&!h.bat&&Math.abs(h.x-b.x)<85&&Math.abs(h.y-b.y)<45);}
function findBulbHolder(S,b){return S.comps.find(h=>h.type==='bulbholder'&&!h.bulb&&Math.abs(h.x-b.x)<70&&(b.y-h.y)>-110&&(b.y-h.y)<50);}

boardSvg.addEventListener('pointerdown',e=>{
  if(drag)return;
  const el=e.target.closest('[data-kind]');if(!el)return;
  e.preventDefault();ensureAudio();
  try{boardSvg.setPointerCapture(e.pointerId);}catch(_){}
  const S=st(),p=svgPt(boardSvg,e),k=el.dataset.kind,base={sx:e.clientX,sy:e.clientY,moved:false};
  if(tab==='conductor'){
    // 집게나 단자를 눌러도 그 물체를 집은 것으로 처리, 전선은 움직이지 않음
    let mat=null;
    if(k==='term'||k==='clip'){
      let t=k==='term'?el.dataset.term:null;
      if(k==='clip'){const w=S.wires.find(x=>x.id===el.dataset.w);t=w&&w[el.dataset.end].t;}
      const c=t&&S.comps.find(x=>x.id===t.split(':')[0]);
      if(c&&c.type==='material')mat=c;else return;
    }else if(k==='wire')return;
    else if(k==='comp'){const c=S.comps.find(x=>x.id===el.dataset.id);if(!c)return;if(c.type==='material')mat=c;else{drag={...base,type:'comp',comp:c,locked:true};return;}}
    pushHist(S);
    S.comps=S.comps.filter(x=>x!==mat);S.comps.push(mat);
    drag={...base,type:'comp',comp:mat,ox:p.x-mat.x,oy:p.y-mat.y};
    return;
  }
  pushHist(S);
  if(k==='wire'){
    const w=S.wires.find(x=>x.id===el.dataset.w);if(!w)return;
    drag={...base,type:'wirebody',w,A:endPos(S,w,'a'),B:endPos(S,w,'b'),px:p.x,py:p.y};
  }else if(k==='clip'){
    const w=S.wires.find(x=>x.id===el.dataset.w);if(!w)return;
    const key=el.dataset.end,end=w[key],tip=endPos(S,w,key);
    end.t=null;end.x=tip.x;end.y=tip.y;
    drag={...base,type:'clip',w,k:key,end,ox:p.x-tip.x,oy:p.y-tip.y};
  }else if(k==='term'){
    const w=addWire(S,{t:el.dataset.term},{t:null,x:p.x,y:p.y});
    drag={...base,type:'newwire',w,k:'b',end:w.b,ox:0,oy:0};
  }else if(k==='comp'){
    const c=S.comps.find(x=>x.id===el.dataset.id);if(!c)return;
    S.comps=S.comps.filter(x=>x!==c);S.comps.push(c);
    drag={...base,type:'comp',comp:c,ox:p.x-c.x,oy:p.y-c.y};
  }
});
let pend=null;
function paletteDown(e){
  if(drag||pend||tab==='em')return;
  ensureAudio();
  if(e.pointerType==='mouse')e.preventDefault();
  pend={el:e.currentTarget,id:e.pointerId,sx:e.clientX,sy:e.clientY,touch:e.pointerType!=='mouse'};
}
// 손가락이 스크롤 방향과 다른 쪽(실험대 쪽)으로 움직이면 그때 부품을 꺼낸다
function pendMove(e){
  if(e.pointerId!==pend.id)return;
  const dx=e.clientX-pend.sx,dy=e.clientY-pend.sy;
  if(!pend.touch){if(Math.hypot(dx,dy)>7)startPaletteDrag(e);return;}
  const rowLayout=window.matchMedia('(max-width:900px)').matches;
  const along=Math.abs(rowLayout?dx:dy),across=Math.abs(rowLayout?dy:dx);
  if(across>10&&across>along)startPaletteDrag(e);
  else if(along>10)pend=null;            // 스크롤하려는 동작 → 브라우저에 맡김
}
function pendUp(e){
  const P=pend;pend=null;if(!P||e.type==='pointercancel')return;
  // 한 번 누르기: 실험대 빈 곳에 놓기
  const S=st(),type=P.el.dataset.type,sp=freeSpot();
  pushHist(S);
  if(type==='wire'){addWire(S,{t:null,x:sp.x-45,y:sp.y},{t:null,x:sp.x+45,y:sp.y});toast('집게를 부품의 동그란 단자에 끌어다 물려 보세요');}
  else{const extra=type==='material'?{mat:P.el.dataset.mat}:type==='switch'?{on:false}:{};const c=addComp(S,type,sp.x,sp.y,extra);afterPlace(S,c);}
  update();
}
function startPaletteDrag(e){
  const P=pend;pend=null;
  const S=st(),p=svgPt(boardSvg,e),type=P.el.dataset.type,base={sx:P.sx,sy:P.sy,moved:true,fromPalette:true};
  pushHist(S);
  if(type==='wire'){
    const w=addWire(S,{t:null,x:p.x-45,y:p.y-20},{t:null,x:p.x+45,y:p.y-20});
    drag={...base,type:'wire2',w,px:p.x,py:p.y};
  }else{
    const extra=type==='material'?{mat:P.el.dataset.mat}:type==='switch'?{on:false}:{};
    const c=addComp(S,type,p.x,p.y,extra);
    drag={...base,type:'comp',comp:c,ox:0,oy:0};
  }
  renderBoard();
}
function boardMove(e){
  const S=st(),d=drag,p=svgPt(boardSvg,e);
  if(!d.moved&&Math.hypot(e.clientX-d.sx,e.clientY-d.sy)>7)d.moved=true;
  if(!d.moved)return;
  if(d.type==='comp'){
    if(d.locked)return;
    if(tab==='conductor'&&d.comp.type==='material'&&!d.detached){d.detached=true;detachTest(S,d.comp);}
    d.comp.x=p.x-d.ox;d.comp.y=p.y-d.oy;S.drop=null;
    if(d.comp.type==='battery'){const h=findHolder(S,d.comp);S.drop=h?h.id:null;}
    if(d.comp.type==='bulb'){const h=findBulbHolder(S,d.comp);S.drop=h?h.id:null;}
    S.snap=findSnap(S,d.comp);
  }else if(d.type==='clip'||d.type==='newwire'){
    d.end.x=p.x-d.ox;d.end.y=p.y-d.oy;S.hover=nearestTerm(S,d.end,otherTerm(d));
  }else if(d.type==='wirebody'){
    // 전선 몸통을 끌면 집게 두 개가 함께 떨어져서 따라온다
    d.w.a={t:null,x:d.A.x,y:d.A.y};d.w.b={t:null,x:d.B.x,y:d.B.y};d.type='wire2';
  }
  if(d.type==='wire2'){
    const dx=p.x-d.px,dy=p.y-d.py;d.px=p.x;d.py=p.y;for(const k of ['a','b']){d.w[k].x+=dx;d.w[k].y+=dy;}
  }
  S.trashHot=nearTrash(p);
  setPalDel(!d.locked&&overPalette(e));
  renderBoard();
}
function boardUp(e){
  const S=st(),d=drag;drag=null;
  const p=svgPt(boardSvg,e),inB=insideBoard(e),overPal=overPalette(e);
  setPalDel(false);
  S.hover=null;S.drop=null;S.trashHot=false;S.snap=null;
  if(d.type==='wirebody'){removeWire(S,d.w);toast('전선을 떼어냈어요');update();return;}
  if(d.type==='comp'){
    const c=d.comp;
    if(!d.moved){
      if(d.fromPalette){const sp=freeSpot();c.x=sp.x;c.y=sp.y;afterPlace(S,c);}
      else tapComp(S,c);
    }else if(d.locked){}
    else if((d.fromPalette&&!inB)||nearTrash(p)||overPal)removeComp(S,c);
    else{
      c.x=clamp(c.x,50,1150);c.y=clamp(c.y,80,715);
      const sn=findSnap(S,c);
      if(sn){c.x+=sn.dx;c.y+=sn.dy;toast('극끼리 바로 연결됐어요! 떼려면 끌어서 떨어뜨려요');}
      afterPlace(S,c);
    }
  }else if(d.type==='clip'||d.type==='newwire'){
    if(nearTrash(p)||overPal)removeWire(S,d.w);
    else if(d.type==='newwire'&&!d.moved)removeWire(S,d.w);
    else{const t=nearestTerm(S,d.end,otherTerm(d));if(t)d.end.t=t;else{d.end.x=clamp(d.end.x,20,1180);d.end.y=clamp(d.end.y,20,700);}}
  }else if(d.type==='wire2'){
    if(!d.moved){const sp=freeSpot();d.w.a.x=sp.x-45;d.w.a.y=sp.y;d.w.b.x=sp.x+45;d.w.b.y=sp.y;toast('집게를 부품의 동그란 단자에 끌어다 물려 보세요');}
    else if((d.fromPalette&&!inB)||nearTrash(p)||overPal)removeWire(S,d.w);
    else for(const k of ['a','b']){const t=nearestTerm(S,d.w[k],null);if(t)d.w[k].t=t;}
  }
  update();
}
function afterPlace(S,c){
  if(c.type==='battery'){
    const h=findHolder(S,c);
    if(h){h.bat={flip:false};removeComp(S,c);toast('전지를 끼웠어요! 끼운 전지를 누르면 방향이 바뀌어요');}
    else toast('전지를 전지 끼우개 위로 끌어다 놓으면 끼워져요');
  }else if(c.type==='bulb'){
    const h=findBulbHolder(S,c);
    if(h){h.bulb=true;removeComp(S,c);toast('전구를 전구 끼우개에 끼웠어요!');}
    else toast('전구를 전구 끼우개 위로 끌어다 놓으면 끼워져요');
  }else if(c.type==='material'&&tab==='conductor')autoAttach(S,c);
}
function detachTest(S,c){
  for(const w of S.wires)if(w.test&&w.rest&&w.b.t&&w.b.t.split(':')[0]===c.id)w.b={t:null,x:w.rest.x,y:w.rest.y};
}
function autoAttach(S,c){
  if(!(c.x>ZONE.x-40&&c.x<ZONE.x+ZONE.w+40&&c.y>ZONE.y-40&&c.y<ZONE.y+ZONE.h+40))return;
  for(const o of [...S.comps])if(o!==c&&o.type==='material'&&o.x>ZONE.x-50&&o.x<ZONE.x+ZONE.w+50&&o.y>ZONE.y-50&&o.y<ZONE.y+ZONE.h+50){detachTest(S,o);removeComp(S,o);}
  c.x=ZONE.cx;c.y=ZONE.cy;
  const ta=S.wires.find(w=>w.test===1),tb=S.wires.find(w=>w.test===2);
  if(ta)ta.b.t=c.id+':0';if(tb)tb.b.t=c.id+':1';
}
function tapComp(S,c){
  if(c.type==='switch'){c.on=!c.on;}
  else if(c.type==='holder'){if(c.bat){c.bat.flip=!c.bat.flip;toast('전지의 방향을 바꿨어요 (+극 ↔ −극)');}else toast('전지를 끌어다 이 끼우개에 끼워 보세요');}
  else if(c.type==='bulbholder'&&!c.bulb)toast('전구를 끌어다 이 끼우개에 끼워 보세요');
  else if(c.type==='battery')toast('전지를 전지 끼우개 위로 끌어다 놓아 보세요');
  else if(c.type==='bulb')toast('전구를 전구 끼우개 위로 끌어다 놓아 보세요');
}

/* ================= 계산 결과 → 화면 ================= */
function update(){const S=st();computeStack(S);S.sim=solve(S);renderBoard();updatePanel();}

function lampWord(b){return b<0.03?'꺼짐':b<0.45?'희미함':b<1.7?'보통':b<3?'밝음':'아주 밝음';}
function motorWord(q){const a=Math.abs(q);return a<0.05?'멈춤':a<0.6?'천천히 돌아요':a<1.4?'보통 빠르기':a<2.4?'빠르게 돌아요':'아주 빠르게 돌아요';}
function buzzWord(v){return v<0.3?'소리 없음':v<1?'작은 소리':v<2?'보통 소리':v<3.5?'큰 소리':'아주 큰 소리';}
function devRow(icon,name,frac,word,num){
  return `<div class="dev"><span class="di">${icon}</span><div class="dm"><div class="dn"><span>${name}</span><b>${word}</b></div><div class="bar"><i style="width:${Math.round(clamp(frac,0,1)*100)}%"></i></div>${num?`<div class="dnum">${num}</div>`:''}</div></div>`;
}
function setStatus(id,cls,ico,txt){const el=$('#'+id);if(!el)return;el.className='status '+cls;el.innerHTML=`<span class="si">${ico}</span><span>${txt}</span>`;}

function circuitFacts(S){
  const r=S.sim,f={lamps:[],motors:[],buzz:[],bats:0,short:false,loose:0,swOff:false};
  for(const c of S.comps){
    if(c.type==='holder'&&c.bat){f.bats++;if(Math.abs(r.cur[c.id]||0)>1.2)f.short=true;}
    if(c.type==='battery'||c.type==='bulb')f.loose++;
    if(c.type==='switch'&&!c.on)f.swOff=true;
    if(c.type==='bulbholder'&&c.bulb){const i=r.cur[c.id]||0;f.lamps.push({c,b:i*i*R_LAMP/P0,v:Math.abs(r.vol[c.id]||0)});}
    if(c.type==='motor'){f.motors.push({c,q:(r.cur[c.id]||0)/IM,v:Math.abs(r.vol[c.id]||0)});}
    if(c.type==='buzzer'){f.buzz.push({c,v:Math.abs(r.vol[c.id]||0)});}
  }
  f.work=f.lamps.some(l=>l.b>=0.03)||f.motors.some(m=>Math.abs(m.q)>=0.05)||f.buzz.some(z=>z.v>=0.3);
  f.loads=f.lamps.length+f.motors.length+f.buzz.length;
  return f;
}
function updatePanel(){
  if(tab==='circuit')updateCircuitPanel();
  else if(tab==='conductor')updateConductorPanel();
}
function updateCircuitPanel(){
  const S=st(),f=circuitFacts(S);
  if(f.short)setStatus('status','warn','⚠️','<b>합선!</b> 전지의 (+)극과 (−)극이 전구 없이 바로 이어졌어요. 실제로 이렇게 하면 전지가 뜨거워져 위험해요.');
  else if(f.work){
    const lit=f.lamps.filter(l=>l.b>=0.03).length;
    setStatus('status','lit','💡',lit?`전기 회로가 완성되어 <b>전구 ${lit}개에 불이 켜졌어요!</b>`:'전기 회로가 완성되어 전기가 흘러요!');
  }
  else if(!f.bats)setStatus('status','','🔋',f.loose?'전지와 전구는 끼우개에 끼워야 연결할 수 있어요.':'전지 끼우개에 전지를 끼워 보세요.');
  else if(!f.loads)setStatus('status','','💡','전구를 전구 끼우개에 끼우거나 전동기·버저를 놓고 전선으로 이어 보세요.');
  else if(f.swOff)setStatus('status','','🖐️','스위치가 꺼져 있어요. 스위치를 눌러 켜 보세요.');
  else setStatus('status','','🔌','전기 회로가 끊어져 있어요. 전지의 (+)극에서 전구를 지나 (−)극까지 전선이 끊기지 않게 이어 보세요.');
  let h='';
  f.lamps.forEach((l,i)=>h+=devRow('💡',`전구 ${i+1}`,l.b/4,lampWord(l.b),opt.num?`전압 ${l.v.toFixed(2)} V`:''));
  f.motors.forEach((m,i)=>h+=devRow('🌀',`전동기 ${i+1}`,Math.abs(m.q)/3,motorWord(m.q)+(Math.abs(m.q)>=0.05?(m.q>0?' ↻':' ↺'):''),opt.num?`전압 ${m.v.toFixed(2)} V`:''));
  f.buzz.forEach((z,i)=>h+=devRow('🔔',`버저 ${i+1}`,z.v/4.5,buzzWord(z.v),opt.num?`전압 ${z.v.toFixed(2)} V`:''));
  if(!h)h='<div class="empty">아직 전구·전동기·버저가 없어요.</div>';
  h+=`<div class="dnum" style="margin-top:6px">실험대의 전지: ${f.bats}개</div>`;
  const d=$('#devices');if(d)d.innerHTML=h;
}
function updateConductorPanel(){
  const S=st(),f=circuitFacts(S);
  let test=null;
  for(const c of S.comps)if(c.type==='material'){
    const att=termsOf(c).map(t=>S.wires.some(w=>w.a.t===t.id||w.b.t===t.id));
    if(att[0]&&att[1]){const rr=MAT[c.mat].cond?S.sim:solve(S,c.id);const valid=Math.abs(rr.cur[c.id]||0)>0.02;test={c,valid};if(valid)S.results[c.mat]=MAT[c.mat].cond;}
  }
  if(f.short)setStatus('status','warn','⚠️','<b>합선!</b> 전지의 두 극이 전구 없이 바로 이어졌어요.');
  else if(test&&test.valid){
    const m=MAT[test.c.mat];
    if(m.cond)setStatus('status','lit','💡',`<b>${m.name}</b>: 전구에 불이 켜졌어요! 전기가 잘 통하는 물질이에요. <b>(도체)</b>`);

  const keys=Object.keys(MAT);

  const done=keys.filter(k=>S.results[k]!==undefined).length,sm=$('#resSummary');
  if(sm)sm.innerHTML=done===keys.length?`<div class="summary">모두 실험했어요! 철 집게, 철 못, 알루미늄 포일처럼 <b>금속</b>으로 된 물체는 전기가 잘 통해요(도체). 나무, 종이, 고무, 플라스틱은 전기가 잘 통하지 않아요(부도체).</div>`:`<div class="dnum" style="margin-top:6px">${done} / ${keys.length}개 실험 완료</div>`;
}

let AC=null,gainNode=null;
function ensureAudio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();const osc=AC.createOscillator();osc.type='square';osc.frequency.value=900;const flt=AC.createBiquadFilter();flt.type='lowpass';flt.frequency.value=2400;gainNode=AC.createGain();gainNode.gain.value=0;osc.connect(flt);flt.connect(gainNode);gainNode.connect(AC.destination);osc.start();}catch(_){AC=null;}}
  if(AC&&AC.state==='suspended')AC.resume();
}
function setBuzz(level){if(!gainNode)return;const g=(opt.sound&&tab!=='em')?Math.min(0.12,level*0.035):0;gainNode.gain.setTargetAtTime(g,AC.currentTime,0.03);}

/* ================= 회로 애니메이션 ================= */
function lampVis(id,b){
  const g=document.getElementById('glow-'+id),gl=document.getElementById('glass-'+id),f=document.getElementById('fil-'+id);
  if(!g||!gl||!f)return;
  if(b<0.03){g.setAttribute('opacity',0);gl.setAttribute('fill','#eaf4fb');gl.setAttribute('fill-opacity','.72');f.setAttribute('stroke','#6b6b6b');return;}
  const s=Math.sqrt(Math.min(b,6));
  g.setAttribute('opacity',Math.min(1,.15+.45*s).toFixed(3));
  g.setAttribute('r',(30+36*s).toFixed(1));
  if(b<0.45){gl.setAttribute('fill','#f7e7b0');gl.setAttribute('fill-opacity','.85');f.setAttribute('stroke','#e07b28');}
  else if(b<2.5){gl.setAttribute('fill','#fff3a8');gl.setAttribute('fill-opacity','.95');f.setAttribute('stroke','#ffae00');}
  else{gl.setAttribute('fill','#fffbe6');gl.setAttribute('fill-opacity','1');f.setAttribute('stroke','#fff2b0');}
}
function boardStep(dt,now){
  const S=st(),r=S.sim;if(!r)return;let buzz=0;
  for(const c of S.comps){
    if(c.type==='bulbholder'&&c.bulb){const i=r.cur[c.id]||0;lampVis(c.id,i*i*R_LAMP/P0);}
    else if(c.type==='motor'){
      const q=(r.cur[c.id]||0)/IM;let a=S.motorAng[c.id]||0;if(Math.abs(q)>0.05)a=(a+q*600*dt)%360;S.motorAng[c.id]=a;
      const g=document.getElementById('rot-'+c.id);if(g)g.setAttribute('transform',`rotate(${a.toFixed(1)})`);
      const bl=document.getElementById('blur-'+c.id);if(bl)bl.setAttribute('opacity',Math.abs(q)>0.05?Math.min(.28,Math.abs(q)*.1).toFixed(3):0);
    }else if(c.type==='buzzer'){
      const v=Math.abs(r.vol[c.id]||0),w=document.getElementById('wave-'+c.id);
      if(v>0.3){buzz+=v/1.5;if(w){w.setAttribute('opacity',(Math.min(1,.35+.3*v/1.5)*(.55+.45*Math.sin(now/55))).toFixed(2));w.setAttribute('transform',`scale(${(1+Math.min(.5,Math.max(0,(v-1.5)/5))).toFixed(2)})`);}}
      else if(w)w.setAttribute('opacity',0);
    }else if(c.type==='holder'&&c.bat){
      const i=Math.abs(r.cur[c.id]||0),hh=document.getElementById('heat-'+c.id);if(hh)hh.setAttribute('opacity',i>1.2?(.35+.3*Math.sin(now/120)).toFixed(2):0);
    }
  }
  setBuzz(buzz);
  for(const w of S.wires){
    const el=document.getElementById('flow-'+w.id);if(!el)continue;
    const i=r.cur[w.id]||0;
    if(opt.flow&&Math.abs(i)>0.004){const sp=Math.min(240,35+90*Math.abs(i)/0.283);let o=((S.flowOff[w.id]||0)-Math.sign(i)*sp*dt)%1700;S.flowOff[w.id]=o;el.setAttribute('stroke-dashoffset',o.toFixed(1));el.setAttribute('opacity',1);}
    else el.setAttribute('opacity',0);
  }
}

let edrag=null;

  else{d.c.x=clamp(p.x-d.ox,50,1150);d.c.y=clamp(p.y-d.oy,50,710);const g=document.getElementById('cmp-'+d.i);if(g)g.setAttribute('transform',`translate(${d.c.x.toFixed(1)} ${d.c.y.toFixed(1)})`);}

function emUp(){
  const d=edrag;edrag=null;if(!d)return;
  if(d.type==='clip'){const c=d.c;c.st='fall';c.vy=0;c.floorY=c.y>598?Math.min(c.y,720):598+Math.random()*48;}
}
function slotPos(e,k,slot){const col=slot%2,row=Math.floor(slot/2),side=k==='R'?1:-1;return {x:e.x+side*2+(col?8:-6),y:e.y+20+row*26,a:90+(col?10:-10)};}
function emStep(dt){
  const emf=emEmf(),on=emOn(),s=Math.abs(emf),dir=Math.sign(emf);
  const ends={L:{x:em.x-182,y:em.y},R:{x:em.x+190,y:em.y}};
  const cap=s>=2?8:4,reach=s>=2?140:85;
  const used={L:new Set(),R:new Set()};
  for(const c of em.clips){
    if(c.st==='held'||c.st==='fly'){
      if(!on||c.slot>=cap){c.st='fall';c.vy=0;c.floorY=598+Math.random()*48;if(c.y>c.floorY)c.floorY=Math.min(c.y,720);}
      else used[c.end].add(c.slot);
    }
  }
  if(on)for(const c of em.clips){
    if(c.st!=='floor'&&c.st!=='fall')continue;
    for(const k of ['L','R']){
      const e=ends[k];
      if(Math.hypot(c.x-e.x,c.y-e.y)<reach){
        let slot=-1;for(let j=0;j<cap;j++)if(!used[k].has(j)){slot=j;break;}
        if(slot>=0){c.st='fly';c.end=k;c.slot=slot;used[k].add(slot);c.a=((c.a%180)+180)%180;break;}
      }
    }
  }
  em.clips.forEach((c,i)=>{
    if(c.st==='fly'||c.st==='held'){
      const t=slotPos(ends[c.end],c.end,c.slot);
      if(c.st==='fly'){const k=Math.min(1,dt*14);c.x+=(t.x-c.x)*k;c.y+=(t.y-c.y)*k;c.a+=(t.a-c.a)*k;if(Math.hypot(t.x-c.x,t.y-c.y)<1.2)c.st='held';}
      else{c.x=t.x;c.y=t.y;c.a=t.a;}
    }else if(c.st==='fall'){
      c.vy+=2200*dt;c.y+=c.vy*dt;if(c.y>=c.floorY){c.y=c.floorY;c.st='floor';c.a+=(Math.random()-.5)*40;}
    }
    const g=document.getElementById('clip-'+i);
    if(g)g.setAttribute('transform',`translate(${c.x.toFixed(1)} ${c.y.toFixed(1)}) rotate(${c.a.toFixed(1)})`);
  });
  // 나침반
  const qR=on?dir*s:0;
  em.compasses.forEach((c,i)=>{
    let bx=0,by=-EARTH;
    if(qR)for(const [px,py,q] of [[em.x+180,em.y,qR],[em.x-174,em.y,-qR]]){const dx=c.x-px,dy=c.y-py,r2=dx*dx+dy*dy+300,r3=r2*Math.sqrt(r2);bx+=q*dx/r3;by+=q*dy/r3;}
    const target=Math.atan2(bx,-by)*180/Math.PI;
    let diff=((target-c.a)%360+540)%360-180;
    c.a+=diff*Math.min(1,dt*5);
    const n=document.getElementById('needle-'+i);if(n)n.setAttribute('transform',`rotate(${c.a.toFixed(1)})`);
  });
  // 전류 흐름
  for(const [id,sg] of em.ws){
    const el=document.getElementById('flow-'+id);if(!el)continue;
    if(on&&em.flow){let o=((em.flowOff[id]||0)-sg*dir*(70*s)*dt)%1700;em.flowOff[id]=o;el.setAttribute('stroke-dashoffset',o.toFixed(1));el.setAttribute('opacity',1);}
    else el.setAttribute('opacity',0);
  }
  emPanelUpdate();
}
let emLast='';
function emPanelUpdate(){
  const e=emEmf(),on=emOn(),s=Math.abs(e),dir=Math.sign(e),leftN=dir<0;
  const L=em.clips.filter(c=>c.st==='held'&&c.end==='L').length,R=em.clips.filter(c=>c.st==='held'&&c.end==='R').length;
  const key=[on,s,em.sw,e,L,R,em.count].join();
  if(key===emLast)return;emLast=key;
  if(!em.sw)setStatus('emStatus','','🖐️','스위치를 눌러 전자석에 전류를 흘려 보세요.');
  else if(e===0)setStatus('emStatus','warn','⚠️','두 전지의 방향이 서로 반대라서 전류가 흐르지 않아요! 전지 하나를 눌러 방향을 맞춰 보세요.');

  info.innerHTML=`<div class="kv"><span>전자석의 세기</span><b>${on?(s>=2?'세다 (전지 2개 직렬)':'보통 (전지 1개)'):'자석의 성질 없음'}</b></div>
  <div class="kv"><span>못 머리 쪽 (왼쪽)</span>${pl(leftN?'N':'S')}</div>
  <div class="kv"><span>못 끝 쪽 (오른쪽)</span>${pl(leftN?'S':'N')}</div>
  <div class="kv"><span>붙은 클립</span><b>${L+R}개</b></div>
  <p class="note">전지의 방향을 바꾸면 전류의 방향이 바뀌어 전자석의 N극과 S극도 서로 바뀌어요. 나침반 바늘이 가리키는 방향을 비교해 보세요.</p>`;
}

    const vb=type==='material'?MAT[mat].vb:IVB[type];
    return `<div class="pitem" data-type="${type}" data-mat="${mat||''}" title="${name}"><svg viewBox="${vb}">${iconSvg(type,mat)}</svg><span>${name}</span></div>`;
  }).join('');
  P.querySelectorAll('.pitem').forEach(el=>el.addEventListener('pointerdown',paletteDown));
}
const HOW=`<details class="sec how"><summary>사용 방법</summary><ul>
<li>왼쪽 부품을 실험대로 끌어다 놓아요. 한 번 누르기만 해도 놓여요.</li>
<li>전지는 전지 끼우개 위에, 전구는 전구 끼우개 위에 끌어다 놓으면 끼워져요.</li>
<li>부품 양 끝의 동그란 금속 단자를 누른 채 다른 단자까지 끌면 집게 달린 전선이 연결돼요.</li>
<li>집게를 끌어서 다른 단자에 다시 물릴 수 있어요.</li>
<li>스위치를 누르면 켜지고 꺼져요. 끼운 전지를 누르면 방향이 바뀌어요.</li>
<li>전선의 가운데 부분을 한 번 누르면 전선이 통째로 떨어져요. 누른 채 끌면 전선을 옮길 수 있어요.</li>
<li>전지 끼우개, 전구 끼우개, 스위치는 양 끝의 극끼리 가까이 대면 전선 없이 바로 붙어요.</li>
<li>필요 없는 것은 왼쪽 부품 상자나 오른쪽 아래 휴지통으로 끌어다 놓으면 치워져요. 실수했으면 ↶ 되돌리기를 눌러요.</li></ul></details>`;
function buildPanel(){
  const P=$('#panel');
  if(tab==='circuit'){
    P.innerHTML=`<div class="status" id="status"></div>
    <div class="sec"><h3>예시 회로 불러오기</h3><div class="chips">
      <button data-preset="basic">기본 회로</button><button data-preset="bseries">전지 직렬</button><button data-preset="bparallel">전지 병렬</button>
      <button data-preset="lseries">전구 직렬</button><button data-preset="lparallel">전구 병렬</button><button data-preset="motor">전동기·버저</button></div></div>
    <div class="sec"><h3>지금 회로에서는</h3><div id="devices" class="devices"></div></div>
    <div class="sec"><h3>보기 설정</h3>
      <label class="tg"><input type="checkbox" id="optFlow"> 전류의 흐름 보기</label>
      <label class="tg"><input type="checkbox" id="optSound"> 버저 소리 켜기</label>
      <label class="tg"><input type="checkbox" id="optNum"> 전압 숫자 보기 (선생님용)</label></div>
    ${HOW}<button class="wide" id="clearBtn">실험대 비우기</button>`;
    P.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{const S=st();pushHist(S);clearState(S);PRESETS[b.dataset.preset](S);update();if(b.dataset.preset==='motor')toast('남는 전지를 직렬로 이어 전동기와 버저의 변화를 살펴보세요');});
    $('#clearBtn').onclick=()=>{const S=st();pushHist(S);clearState(S);update();toast('실험대를 비웠어요. 되돌리기로 다시 살릴 수 있어요');};
  }else if(tab==='conductor'){
    P.innerHTML=`<div class="status" id="status"></div>
    <div class="sec"><h3>실험 결과 기록</h3><table class="res" id="results"></table><div id="resSummary"></div></div>
    <div class="sec"><h3>보기 설정</h3><label class="tg"><input type="checkbox" id="optFlow"> 전류의 흐름 보기</label></div>
    <details class="sec how" open><summary>실험 방법</summary><ol>
      <li>왼쪽의 물체를 끌어 점선 상자 안에 놓아요.</li><li>집게 두 개가 물체의 양쪽 끝을 저절로 물어요.</li><li>물체를 다시 집으면 집게가 떨어져요. 다른 물체를 넣어 비교해 보세요.</li><li>전구에 불이 켜지는지 관찰하고 기록을 확인해요.</li></ol></details>
    <button class="wide" id="resetCond">처음부터 다시 하기</button>`;
    $('#resetCond').onclick=()=>{const S=st();pushHist(S);presetConductor(S);S.results={};update();};
  }else{
    P.innerHTML=`<div class="status" id="emStatus"></div>
    <div class="sec"><h3>전지</h3><div class="seg"><button data-n="1">전지 1개</button><button data-n="2">전지 2개 (직렬)</button></div><button style="width:100%" id="emFlip">전지 방향 모두 바꾸기</button></div>
    <div class="sec"><h3>스위치</h3><button class="big" id="emSwBtn">스위치 켜기</button></div>
    <div class="sec"><h3>관찰하기</h3><div id="emInfo"></div></div>
    <div class="sec"><h3>보기 설정</h3>
      <label class="tg"><input type="checkbox" id="emPoles"> N극·S극 표시</label>
      <label class="tg"><input type="checkbox" id="emComps"> 나침반 놓기</label>
      <label class="tg"><input type="checkbox" id="emFlow"> 전류의 흐름 보기</label></div>
    <button class="wide" id="emClipReset">클립 다시 흩어 놓기</button>`;
    P.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{em.count=+b.dataset.n;emRender();syncEmPanel();});
    $('#emFlip').onclick=()=>{em.flips=em.flips.map(f=>!f);emRender();syncEmPanel();toast('전지의 방향을 모두 바꿨어요');};
    $('#emSwBtn').onclick=()=>{em.sw=!em.sw;emRender();syncEmPanel();};
    $('#emClipReset').onclick=()=>{emReset();emRender();};
    const bind=(id,key)=>{const el=$('#'+id);el.checked=em[key];el.onchange=()=>{em[key]=el.checked;emRender();};};
    bind('emPoles','poles');bind('emComps','comps');bind('emFlow','flow');
    syncEmPanel();
    return;
  }
  const bindO=(id,key)=>{const el=$('#'+id);if(!el)return;el.checked=opt[key];el.onchange=()=>{opt[key]=el.checked;ensureAudio();updatePanel();};};
  bindO('optFlow','flow');bindO('optSound','sound');bindO('optNum','num');
}
function setTab(t){
  tab=t;setBuzz(0);
  document.querySelectorAll('.tab').forEach(b=>{b.classList.toggle('on',b.dataset.tab===t);b.setAttribute('aria-selected',b.dataset.tab===t);});
  $('#main').classList.toggle('em',t==='em');
  boardSvg.style.display=t==='em'?'none':'block';
  emSvg.style.display=t==='em'?'block':'none';
  buildPanel();syncUndo();
  if(t==='em'){emRender();}
  else{buildPalette();update();}
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
$('#undoBtn').onclick=undo;
window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();}});
(function(){
  const de=document.documentElement,b=$('#fsBtn');
  const req=de.requestFullscreen||de.webkitRequestFullscreen,exit=document.exitFullscreen||document.webkitExitFullscreen;
  if(!req){b.style.display='none';return;}
  const isFs=()=>document.fullscreenElement||document.webkitFullscreenElement;
  b.onclick=()=>{try{isFs()?exit.call(document):req.call(de);}catch(_){}};
  const sync=()=>{b.textContent=isFs()?'⛶ 전체 화면 끝내기':'⛶ 전체 화면';};
  document.addEventListener('fullscreenchange',sync);document.addEventListener('webkitfullscreenchange',sync);
})();

/* ================= 공통 포인터 · 반복 ================= */
window.addEventListener('pointermove',e=>{if(drag)boardMove(e);else if(edrag)emMove(e);else if(pend)pendMove(e);});
// 부품을 끌고 있는 동안에는 화면이 스크롤되지 않게
document.addEventListener('touchmove',e=>{if(drag||edrag)e.preventDefault();},{passive:false});
function endPointer(e){if(drag)boardUp(e);else if(edrag)emUp(e);else if(pend)pendUp(e);}
window.addEventListener('pointerup',endPointer);
window.addEventListener('pointercancel',endPointer);

let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(tab==='em')emStep(dt);else boardStep(dt,now);
  requestAnimationFrame(loop);
}
presetConductor(states.conductor);
emReset();
setTab('circuit');
requestAnimationFrame(loop);
</script>
</body>
</html>
